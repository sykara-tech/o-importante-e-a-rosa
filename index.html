<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="theme-color" content="#3b1738">
<meta name="description" content="Cantinho de Luz para Emily — aperte e descubra.">
<title>"O Importante é a Rosa!"</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600;700&family=Playfair+Display:ital,wght@0,500;0,600;0,700;1,500;1,600&display=swap" rel="stylesheet">
<style>
:root{
  --wine:#3b1738;
  --wine2:#57264c;
  --rose:#b93459;
  --pink:#e6a6b1;
  --gold:#d8b46d;
  --cream:#fbf7f1;
  --ink:#38283b;
  --muted:#817782;
  --serif:"Playfair Display",Georgia,serif;
  --sans:"DM Sans",Arial,sans-serif;
}
*{box-sizing:border-box;margin:0;padding:0}
html,body{width:100%;height:100%;min-height:100%;overflow:hidden}
body{
  background:var(--wine);
  color:white;
  font-family:var(--sans);
  display:flex;
  align-items:center;
  justify-content:center;
  min-height:100vh;
  position:relative;
}

/* Fundo sutil */
.bg-glow{
  position:fixed;inset:0;
  background:
    radial-gradient(ellipse at 30% 20%, #57264c88 0%, transparent 50%),
    radial-gradient(ellipse at 70% 80%, #b9345933 0%, transparent 45%),
    linear-gradient(160deg,#1f0f1c 0%,#3b1738 50%,#271329 100%);
  z-index:0;
}

/* Container principal */
.stage{
  position:relative;z-index:2;
  width:min(920px,94vw);
  height:min(560px,78vh);
  border-radius:18px;
  overflow:hidden;
  box-shadow:0 30px 80px #00000066, 0 0 0 1px #ffffff12;
  background:#1a0c18;
  display:flex;
  align-items:center;
  justify-content:center;
}

/* Vídeo */
video{
  position:absolute;inset:0;
  width:100%;height:100%;
  object-fit:contain;
  opacity:0;
  transition:opacity .6s ease;
  background:#0d0610;
}
video.playing{opacity:1}

/* Overlay inicial "Aperte-me" */
.play-overlay{
  position:absolute;inset:0;
  display:flex;flex-direction:column;
  align-items:center;justify-content:center;
  gap:28px;
  background:linear-gradient(160deg,#261229ee 0%,#3b1738cc 50%,#1f0f1cee 100%);
  z-index:5;
  cursor:pointer;
  transition:opacity .5s ease, visibility .5s;
}
.play-overlay.hidden{
  opacity:0;visibility:hidden;pointer-events:none;
}

.play-btn{
  width:96px;height:96px;
  border-radius:50%;
  background:var(--rose);
  border:3px solid #ffffff40;
  display:grid;place-items:center;
  box-shadow:0 12px 40px #b9345966, 0 0 0 12px #b9345922;
  transition:transform .25s ease, box-shadow .25s, background .2s;
  position:relative;
}
.play-btn::after{
  content:"";
  width:0;height:0;
  border-style:solid;
  border-width:14px 0 14px 24px;
  border-color:transparent transparent transparent white;
  margin-left:6px;
}
.play-overlay:hover .play-btn{
  transform:scale(1.08);
  background:#a02a4a;
  box-shadow:0 16px 50px #b9345988, 0 0 0 16px #b9345933;
}

.play-label{
  font:600 22px/1.2 var(--serif);
  letter-spacing:1px;
  color:#f8e8ee;
  text-align:center;
}
.play-label small{
  display:block;
  margin-top:8px;
  font:500 12px var(--sans);
  letter-spacing:2.5px;
  text-transform:uppercase;
  color:var(--gold);
  opacity:.9;
}

/* Rosa decorativa */
.rose-deco{
  position:absolute;
  bottom:24px;right:28px;
  width:48px;opacity:.35;
  pointer-events:none;
  z-index:4;
}
.rose-deco svg{width:100%;height:auto}

/* Overlay final "Espero que goste!" */
.end-overlay{
  position:absolute;inset:0;
  display:flex;flex-direction:column;
  align-items:center;justify-content:center;
  gap:22px;
  background:linear-gradient(160deg,#1f0f1cf2 0%,#3b1738ee 55%,#261229f5 100%);
  z-index:6;
  opacity:0;visibility:hidden;
  transition:opacity .7s ease, visibility .7s;
  padding:30px;
  text-align:center;
}
.end-overlay.show{
  opacity:1;visibility:visible;
}

.end-overlay .eyebrow{
  font-size:11px;
  letter-spacing:2.5px;
  font-weight:700;
  color:var(--gold);
  text-transform:uppercase;
}
.end-overlay h2{
  font:600 clamp(28px,5vw,42px)/1.15 var(--serif);
  color:white;
  max-width:420px;
}
.end-overlay h2 em{color:#e7b1bd;font-style:italic}

.btn-gostei{
  display:inline-flex;
  align-items:center;
  gap:10px;
  margin-top:12px;
  background:var(--rose);
  color:white;
  padding:16px 32px;
  border-radius:6px;
  font:600 15px var(--sans);
  text-decoration:none;
  border:none;
  cursor:pointer;
  box-shadow:0 10px 30px #b9345955;
  transition:transform .2s, background .2s, box-shadow .2s;
}
.btn-gostei:hover{
  background:#a02a4a;
  transform:translateY(-3px);
  box-shadow:0 14px 36px #b9345977;
}
.btn-gostei span{font-size:18px}

/* Créditos discretos */
.credit{
  position:fixed;
  bottom:18px;left:0;right:0;
  text-align:center;
  font-size:12px;
  color:#e8d5df66;
  z-index:3;
  pointer-events:none;
}

/* Controles mínimos do vídeo (aparecem só durante a reprodução) */
.video-controls{
  position:absolute;
  bottom:0;left:0;right:0;
  padding:16px 20px;
  background:linear-gradient(transparent, #0d0610cc);
  display:flex;align-items:center;gap:14px;
  z-index:4;
  opacity:0;
  transition:opacity .3s;
}
.stage:hover .video-controls,
.video-controls:focus-within{opacity:1}
video.playing ~ .video-controls{opacity:1}

.progress{
  flex:1;height:4px;
  background:#ffffff22;
  border-radius:2px;
  cursor:pointer;
  overflow:hidden;
}
.progress-bar{
  height:100%;width:0%;
  background:var(--rose);
  border-radius:2px;
  transition:width .1s linear;
}
.time{font-size:12px;color:#e8d5df;min-width:70px;text-align:right}

/* Mobile */
@media(max-width:600px){
  body{min-height:100vh;min-height:100dvh}
  .stage{
    position:fixed;
    inset:0;
    width:100vw;
    height:100vh;
    height:100dvh;
    max-width:none;
    border-radius:0;
    box-shadow:none;
  }
  video{object-fit:contain;background:#000}
  .play-overlay{padding:24px}
  .rose-deco{bottom:calc(18px + env(safe-area-inset-bottom));right:18px;width:38px}
  .credit{bottom:calc(10px + env(safe-area-inset-bottom));font-size:10px}
  .video-controls{padding:14px 14px calc(14px + env(safe-area-inset-bottom))}
  .end-overlay{padding:24px 20px}
  .stage{height:min(100vh,100dvh)}
  .play-btn{width:80px;height:80px}
  .play-btn::after{border-width:12px 0 12px 20px}
  .play-label{font-size:18px}
  .end-overlay h2{font-size:26px}
  .btn-gostei{padding:14px 26px;font-size:14px}
}
</style>
</head>
<body>

<div class="bg-glow"></div>

<div class="stage" id="stage">
  <!-- 
    SUBSTITUA o src abaixo pelo caminho do seu vídeo.
    Vídeo local conectado: video-emily.mp4
    Ou use um link direto de vídeo.
  -->
  <video id="video" playsinline preload="metadata"
    src="video-emily.mp4"
    poster="">
    Seu navegador não suporta vídeo.
  </video>

  <!-- Overlay inicial -->
  <div class="play-overlay" id="playOverlay" role="button" tabindex="0" aria-label="Aperte para reproduzir o vídeo">
    <div class="play-btn"></div>
    <div class="play-label">
      Aperte-me
      <small>Eu disse que não faria Cartaz!😘</small>
    </div>
  </div>

  <!-- Controles simples -->
  <div class="video-controls" id="controls">
    <div class="progress" id="progress">
      <div class="progress-bar" id="progressBar"></div>
    </div>
    <span class="time" id="time">0:00 / 0:00</span>
  </div>

  <!-- Overlay final -->
  <div class="end-overlay" id="endOverlay">
    <p class="eyebrow">Feito no Simples, Mas com Carinho do seu Best!</p>
    <h2>Espero que <em>goste!</em></h2>
    <a class="btn-gostei" href="cantinho.html">
      Clique Aqui! <span>→</span>
    </a>
  </div>

  <!-- Rosa decorativa -->
  <div class="rose-deco" aria-hidden="true">
    <svg viewBox="0 0 180 230">
      <path d="M91 218 C88 170 105 132 91 92" stroke="#77906b" stroke-width="5" fill="none"/>
      <path d="M92 168 Q48 135 35 157 Q61 181 92 168" fill="#6e8a61"/>
      <path d="M96 144 Q137 111 147 132 Q129 156 96 144" fill="#829a70"/>
      <path d="M91 105 C54 95 45 66 68 48 C57 18 91 7 106 29 C133 15 153 46 134 66 C148 92 116 112 91 105Z" fill="#b6294c"/>
      <path d="M91 102 C65 83 77 62 93 60 C75 42 103 28 117 48 C138 70 113 95 91 102Z" fill="#e95b75"/>
      <path d="M90 99 C78 80 91 70 102 77 C116 85 103 98 90 99Z" fill="#8f1839"/>
    </svg>
  </div>
</div>

<p class="credit">Feito com amor por Guilherme  •  Para Emily</p>

<script>
const video = document.getElementById('video');
const playOverlay = document.getElementById('playOverlay');
const endOverlay = document.getElementById('endOverlay');
const progressBar = document.getElementById('progressBar');
const progress = document.getElementById('progress');
const timeEl = document.getElementById('time');

function formatTime(s) {
  if (!isFinite(s)) return '0:00';
  const m = Math.floor(s / 60);
  const sec = Math.floor(s % 60).toString().padStart(2, '0');
  return `${m}:${sec}`;
}

function startVideo() {
  playOverlay.classList.add('hidden');
  video.classList.add('playing');
  video.play().catch(() => {
    // se autoplay for bloqueado, o usuário já clicou, tenta de novo
    video.play();
  });
}

playOverlay.addEventListener('click', startVideo);
playOverlay.addEventListener('keydown', e => {
  if (e.key === 'Enter' || e.key === ' ') {
    e.preventDefault();
    startVideo();
  }
});

video.addEventListener('timeupdate', () => {
  if (video.duration) {
    const pct = (video.currentTime / video.duration) * 100;
    progressBar.style.width = pct + '%';
    timeEl.textContent = `${formatTime(video.currentTime)} / ${formatTime(video.duration)}`;
  }
});

video.addEventListener('ended', () => {
  endOverlay.classList.add('show');
  video.classList.remove('playing');
});

// Se o arquivo de vídeo ainda não estiver na pasta, não deixa a introdução presa.
// O visitante continua podendo abrir o cantinho pelo mesmo botão final.
video.addEventListener('error', () => {
  playOverlay.classList.add('hidden');
  endOverlay.classList.add('show');
  const eyebrow = endOverlay.querySelector('.eyebrow');
  const heading = endOverlay.querySelector('h2');
  if (eyebrow) eyebrow.textContent = 'Uma surpresa preparada com carinho';
  if (heading) heading.innerHTML = 'O importante é <em>a rosa!</em>';
});

// Clique na barra de progresso
progress.addEventListener('click', e => {
  if (!video.duration) return;
  const rect = progress.getBoundingClientRect();
  const ratio = (e.clientX - rect.left) / rect.width;
  video.currentTime = ratio * video.duration;
});

// Se o usuário clicar no vídeo enquanto toca, pausa/retoma
video.addEventListener('click', () => {
  if (video.paused) video.play();
  else video.pause();
});
</script>
</body>
</html>
